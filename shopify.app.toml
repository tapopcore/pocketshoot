# Shopify app configuration. Deploy with: shopify app deploy
# Replace the URLs with your production domain and client_id with your app's API key.
client_id = "REPLACE_WITH_SHOPIFY_API_KEY"
name = "PocketShoot: AI Product Photos"
handle = "pocketshoot-product-photos"
application_url = "https://REPLACE_WITH_DOMAIN/shopify"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# read_products to list products and images; write_products to add approved photos to products
scopes = "read_products,write_products"

[auth]
redirect_urls = ["https://REPLACE_WITH_DOMAIN/shopify"]

[access.admin]
direct_api_mode = "offline"
embedded_app_direct_api_access = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled", "app_purchases_one_time/update"]
  uri = "https://REPLACE_WITH_DOMAIN/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://REPLACE_WITH_DOMAIN/api/webhooks/shopify"

[pos]
embedded = false
